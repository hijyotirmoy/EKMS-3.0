<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>EKMS 3.0</title>
  <script>
    window.location.replace("https://ekms.in");
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .container {
      text-align: center;
      padding: 24px;
      max-width: 380px;
    }
    .logo-badge {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
    }
    .logo-badge img {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">
      <img src="ekms-logo.png" alt="EKMS Logo" />
    </div>
    <h1>EKMS 3.0</h1>
    <p>Loading EKMS...</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
